<style>
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
*{box-sizing:border-box}
a{color:oklch(70% 0.19 25);text-decoration:none}a:hover{text-decoration:underline}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#262626;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
textarea::placeholder,input::placeholder{color:#8a8a8a}
select{color-scheme:dark}
body{font-variant-numeric:tabular-nums}
*:focus-visible{outline:2px solid oklch(70% 0.19 25);outline-offset:2px}

@keyframes lai-spin{to{transform:rotate(360deg)}}
@keyframes lai-shimmer{from{background-position:100% center}to{background-position:0% center}}
@keyframes lai-blink{50%{opacity:0}}
@keyframes lai-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes lai-pulse{0%,100%{box-shadow:0 0 0 0 oklch(62% 0.21 25 / .35)}50%{box-shadow:0 0 0 6px transparent}}
@keyframes lai-px{0%,100%{opacity:.15;transform:scale(.9)}50%{opacity:.95;transform:scale(1.1)}}
.lai-spin{animation:lai-spin .8s linear infinite}
.lai-shimmer{display:inline-block;background-image:linear-gradient(90deg,#666 40%,#fff 50%,#666 60%);background-size:250% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:lai-shimmer 2s linear infinite}
.lai-caret::after{content:"▍";color:oklch(62% 0.21 25);animation:lai-blink 1s step-start infinite}
.lai-in{animation:lai-in .18s ease-out}
.lai-pulse{animation:lai-pulse 1.8s ease-in-out infinite}
.lai-px{display:grid;grid-template-columns:repeat(3,3px);gap:1.5px;flex:none}
.lai-px i{width:3px;height:3px;border-radius:50%;background:#ddd;opacity:.2;animation:lai-px 650ms cubic-bezier(.23,1,.32,1) infinite}
.lai-px i:nth-child(1),.lai-px i:nth-child(5),.lai-px i:nth-child(7){animation-delay:90ms}
.lai-px i:nth-child(2),.lai-px i:nth-child(6),.lai-px i:nth-child(8){animation-delay:180ms}
.lai-px i:nth-child(3),.lai-px i:nth-child(9){animation-delay:270ms}
@media(prefers-reduced-motion:reduce){.lai-px i{animation:none;opacity:.6}.lai-spin,.lai-shimmer,.lai-pulse,.lai-in{animation:none}.lai-caret::after{animation:none}}

.hv:hover{background:#111!important}
.hv2:hover{background:#141414!important}
.hv-stroke:hover svg{stroke:oklch(70% 0.19 25)!important}
.hv-color:hover{color:#fff!important}
.hv-bg111:hover{background:#111!important}
.hv-del:hover{color:oklch(70% 0.19 25)!important}
.hv-del:hover svg{stroke:oklch(70% 0.19 25)!important}

#homeCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style>

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function md(text){
  if(!text)return'';
  const FENCE='```', lines=text.split('\n'), out=[];
  let i=0;
  while(i<lines.length){
    const l=lines[i];
    if(l.startsWith(FENCE)){
      const lang=esc(l.slice(3).trim()||'text'), buf=[];
      i++;
      while(i<lines.length&&!lines[i].startsWith(FENCE))buf.push(esc(lines[i++]));
      i++;
      out.push(`<div style="border:1px solid #1f1f1f;border-radius:9px;background:#050505;overflow:hidden;margin:6px 0">
        <div style="display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #1a1a1a;font:500 11px 'JetBrains Mono',monospace;color:#8a8a8a"><span>${lang}</span><span class="copy-code hv2" style="cursor:pointer;padding:2px 8px;border-radius:4px">Copy</span></div>
        <pre style="margin:0;padding:12px 14px;overflow-x:auto;font:400 14px/1.65 'JetBrains Mono',monospace;color:#d0d0d0">${buf.join('\n')}</pre></div>`);
    } else if(/^#{1,3}\s/.test(l)){
      out.push(`<div style="font:600 20px/1.35 'Instrument Sans';color:#fff;margin-top:6px">${inlineMd(l.replace(/^#{1,3}\s/,''))}</div>`);
      i++;
    } else if(/^\s*[-*]\s/.test(l)){
      const items=[];
      while(i<lines.length&&/^\s*[-*]\s/.test(lines[i]))items.push(inlineMd(lines[i++].replace(/^\s*[-*]\s/,'')));
      out.push(`<ul style="margin:4px 0;padding-left:22px"><li style="margin:3px 0">${items.join('</li><li style="margin:3px 0">')}</li></ul>`);
    } else if(/^\s*\d+\.\s/.test(l)){
      const items=[];
      while(i<lines.length&&/^\s*\d+\.\s/.test(lines[i]))items.push(inlineMd(lines[i++].replace(/^\s*\d+\.\s/,'')));
      out.push(`<ol style="margin:4px 0;padding-left:22px"><li style="margin:3px 0">${items.join('</li><li style="margin:3px 0">')}</li></ol>`);
    } else if(l.startsWith('|')){
      const rows=[];
      while(i<lines.length&&lines[i].startsWith('|')){
        if(!/^\|[\s:|-]+\|?$/.test(lines[i]))rows.push(lines[i].split('|').slice(1,-1).map(c=>esc(c.trim())));
        i++;
      }
      if(rows.length){
        const hdr=rows[0], body=rows.slice(1);
        out.push(`<div style="overflow-x:auto;margin:6px 0"><table style="border-collapse:collapse;font:400 15px 'Instrument Sans';color:#ddd">
          <tbody>${[hdr,...body].map(r=>'<tr>'+r.map(c=>`<td style="border:none;border-bottom:1px solid #1f1f1f;padding:6px 18px 6px 0;white-space:nowrap">${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`);
      }
    } else if(l.trim()===''){i++;}
    else {
      const buf=[];
      while(i<lines.length&&lines[i].trim()&&!lines[i].startsWith(FENCE)&&!/^#{1,3}\s/.test(lines[i])&&!/^\s*[-*]\s/.test(lines[i])&&!/^\s*\d+\.\s/.test(lines[i])&&!lines[i].startsWith('|'))buf.push(lines[i++]);
      out.push(`<div style="margin:4px 0">${inlineMd(buf.join(' '))}</div>`);
    }
  }
  return out.join('');
}
function inlineMd(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code style="font:400 0.88em \'JetBrains Mono\',monospace;background:#161616;padding:1px 5px;border-radius:3px;color:#e5e5e5">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong style="font-weight:600;color:#fff">$1</strong>');
}

function timeAgo(ts){
  const d=Date.now()/1000-ts, m=d/60, h=m/60;
  if(m<1)return'Just now';
  if(m<60)return Math.floor(m)+'m ago';
  if(h<24)return Math.floor(h)+'h ago';
  const days=Math.floor(h/24);
  if(days===1)return'Yesterday';
  if(days<7)return days+'d ago';
  return new Date(ts*1000).toLocaleDateString();
}
function mmss(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function fmtTok(n){return n>=1000?(n/1000).toFixed(1)+'k':String(Math.round(n))}

  // The real autonomous pipeline (agent/pipeline/autonomous_driver.py): the agent drives a full
  // RECON→CLOSEOUT engagement itself, streaming phase/wave events the SSE handler already renders.
  async startPipeline(sid,data){return(await fetch('/api/sessions/'+sid+'/pipeline/start',{method:'POST',headers:apiHeaders(),body:JSON.stringify(data)})).json()},
  async stopPipeline(sid){return(await fetch('/api/sessions/'+sid+'/pipeline/stop',{method:'POST',headers:apiHeaders()})).json()},
};

/* SSE */
function connectSSE(sessionId){
  disconnectSSE();
  /* EventSource cannot set headers, so the API key rides as ?key= — the one query-param
     channel the server accepts (see _key_supplied in dev_server.py). Without this the SSE
     stream is the only part of the UI that 401s once a key file exists. */
  const url='/api/sessions/'+sessionId+'/events'+(S.apiKey?('?key='+encodeURIComponent(S.apiKey)):'');
  const es=new EventSource(url);
  S.eventSource=es;
  es.onmessage=function(e){try{handleServerEvent(JSON.parse(e.data))}catch(err){console.error('SSE parse error',err)}};
  es.onerror=function(){if(S.conn!=='reconnecting'){S.conn='reconnecting';render(true);}};
  es.onopen=function(){if(S.conn!=='online'){S.conn='online';render(true);};};
}
function disconnectSSE(){if(S.eventSource){S.eventSource.close();S.eventSource=null;}}

function handleServerEvent(evt){
  const sid=S.activeSession;
  if(!sid)return;
  switch(evt.type){
    case 'message':
      if(!S.threads[sid])S.threads[sid]=[];
      if(evt.record.role==='user'){if(S.running)break;const last=S.threads[sid][S.threads[sid].length-1];if(last&&last.role==='user'&&last.content===evt.record.content)break;}
      S.threads[sid].push(evt.record);
      if(S.streamingText&&evt.record.role==='assistant'){
        const last=S.threads[sid][S.threads[sid].length-1];
        if(!last.content&&S.streamingText)last.content=S.streamingText;
        S.streamingText='';S.streamingReasoning='';
      }
      render();softScroll();break;
    case 'assistant_delta':S.streamingText+=evt.text;updateStreamingText();break;
    case 'reasoning_delta':S.streamingReasoning+=evt.text;updateStreamingReasoning();break;
    case 'context':S.ctxUsage={prompt_tokens:evt.prompt_tokens,completion_tokens:evt.completion_tokens};if(evt.max)CTX_MAX=evt.max;render(true);break;
    case 'stage':if(evt.stage)S.stage=evt.stage;render(true);break;
    case 'steer_applied':
      if(!S.threads[sid])S.threads[sid]=[];
      S.threads[sid].push({role:'system',content:'Steer applied mid-run: '+(evt.text||'')});
      render();softScroll();break;
    case 'compacted':
      if(!S.threads[sid])S.threads[sid]=[];
      S.threads[sid].push({role:'system',content:(evt.scope==='in-turn'?'Compacted mid-run — folded ':'Context compacted — folded ')+(evt.folded||0)+' earlier messages into a summary'});
      render();softScroll();break;
    case 'task_done':stampDuration(sid);S.running=false;clearInterval(S.elapsedTimer);S.streamingText='';S.streamingReasoning='';render();break;
    case 'task_error':S.running=false;clearInterval(S.elapsedTimer);S.streamingText='';toast('Error: '+evt.error);render();break;
    case 'autonomous_event':
      if(!S.threads[sid])S.threads[sid]=[];
      S.threads[sid].push({role:'system',content:'['+evt.event.type+'] '+(evt.event.detail||evt.event.phase||''),_raw:evt.event});
      render();softScroll();break;
    case 'autonomous_done':
      stampDuration(sid);S.running=false;clearInterval(S.elapsedTimer);
      if(!S.threads[sid])S.threads[sid]=[];
      S.threads[sid].push({role:'system',content:'Autonomous run finished — '+evt.status+(evt.reason?' · '+evt.reason:'')});
      render();softScroll();break;
    case 'autonomous_error':S.running=false;clearInterval(S.elapsedTimer);toast('Autonomous error: '+evt.error);render();break;
    // The turn thread is now blocked waiting for the answer, so fetch the card immediately
    // rather than waiting up to 5s for the next poll tick.
    // No chat line: the header banner and the Approvals panel are where this is surfaced,
    // and the renderer deliberately suppresses '\u23f3 Awaiting approval' lines in favour of them.
    case 'approval_required':S.approvalsOpen=true;pollApprovals();render();break;
    case 'approval_timeout':
      if(!S.threads[sid])S.threads[sid]=[];
      S.threads[sid].push({role:'system',content:'Approval for '+(evt.tool||'an action')+' went unanswered and was treated as declined \u2014 the action did NOT run'});
      pollApprovals();render();softScroll();break;
    case 'approval_resolved':pollApprovals();render(true);break;
    // Previously dropped on the floor: the server has been pushing this since injection
    // screening was wired in, and nothing rendered it, so the one signal that says "this output
    // tried to redirect the agent" never reached the operator.
    case 'injection_flagged':
      if(!S.threads[sid])S.threads[sid]=[];
      S.threads[sid].push({role:'system',content:'\u26a0 Possible prompt injection in '+(evt.tool||'tool')+' output ('+(evt.verdict||'flagged')+(evt.reasons&&evt.reasons.length?': '+evt.reasons.join(', '):'')+')'+(evt.tainted?'. The session is now held to passive recon \u2014 each further action needs your approval for the next 5 minutes.':'. From the local knowledge index, so the session was not restricted.')});
      render();softScroll();break;
    case 'taint_error':toast('Taint store write failed: '+evt.error);break;
    case 'audit_error':toast('Audit write failed: '+evt.error);break;
  }
}

async function sendMessage(){
  const text=S.input.trim();if(!text||S.running)return;
  let sid=S.activeSession;
  if(!sid){
    try{
      const res=await api.createSession({use_security_tools:S.securityTools,engagement_id:S.engagementId,isolation_tier:S.isolation,thinking:S.thinking});
      sid=res.session_id;
      S.sessions.unshift({id:sid,title:text.slice(0,60),sub:'Just now',live:true,ts:Date.now()/1000,count:0});
      S.threads[sid]=[];S.activeSession=sid;S.view='chat';connectSSE(sid);
    }catch(e){toast('Failed to create session: '+e.message);return;}
  }
  S.input='';S.running=true;S.elapsed=0;S.streamingText='';S.streamingReasoning='';
  clearInterval(S.elapsedTimer);S.elapsedTimer=setInterval(()=>{S.elapsed++;updateElapsed()},1000);
  if(!S.threads[sid])S.threads[sid]=[];
  S.threads[sid].push({role:'user',content:text});render();scrollToBottom();
  // Guided mode follows the staged pentest protocol (work→report→wait for operator). A bare
  // greeting like "สวัสดี" shouldn't kick off recon, so a trivial message is sent as plain chat
  // even in a guided-mode session; anything actionable runs under the stage protocol.
  const actionable=/https?:\/\/|\b\d{1,3}(\.\d{1,3}){3}\b|\b(scan|recon|exploit|pentest|vuln|attack|inject|enumerate|fuzz|brute|target|report|validate|analy|เจาะ|สแกน|ช่องโหว่|โจมตี|เป้าหมาย|รายงาน|ยืนยัน|วิเคราะห์|รีคอน)\b/i.test(text)||text.length>40;
  // Autonomous mode hands the goal to the pipeline, which drives the whole engagement itself —
  // its phase/wave events arrive over the same SSE and are rendered like any other.
  if(S.mode==='autonomous'){
    try{
      await api.startPipeline(sid,{engagement_id:S.engagementId,profile:'web_api',mode:'autonomous',user_message:text});
    }catch(e){S.running=false;clearInterval(S.elapsedTimer);toast('Pipeline start failed: '+e.message);render();}
    return;
  }
  const guided=S.mode==='guided'&&actionable;
  try{
    await api.sendMessage(sid,text,guided,guided?S.stage:null);
  }catch(e){S.running=false;clearInterval(S.elapsedTimer);toast('Send failed: '+e.message);render();}
}

  if(S.activeSession===sid)goHome();else render();toast('Session deleted');}catch(e){toast('Delete failed: '+e.message)}
}

/* Live-refresh the open graph/notebook/findings so the tree "runs" while the agent works —
   only re-renders when the data actually changed, to avoid disrupting zoom/pan/reading. */
let _graphPoll=null;
function _graphSig(g){if(!g||!g.nodes)return'';return g.nodes.map(n=>(n.ordinal||n.id)+':'+(n.status||'')+':'+(n.verdict||'')).join('|')+'#'+((g.edges||[]).length);}
function startGraphPoll(){
  stopGraphPoll();
  _graphPoll=setInterval(async()=>{
    if(S.view!=='graph'){stopGraphPoll();return;}
    try{
      if(S.graphTab==='tree'){
        const g=await api.getGraph((S.activeSession||S.engagementId));
        if(_graphSig(g)!==_graphSig(S.graphData)){S.graphData=g;render();}
      }else if(S.graphTab==='notes'){
        const d=await api.getNotebook((S.activeSession||S.engagementId));
        if((d.notes||[]).length!==S.notes.length){S.notes=d.notes||[];render();}

        if((d.findings||[]).length!==S.findings.length){S.findings=d.findings||[];render();}
      }
    }catch(e){}
  },3000);
}

function _doRender(){

/* Home background: ASCII "wake". A sparse static ambient glyph scatter sits at rest;
   the pointer stamps a decaying heat trail into the monospace grid (fast pass = thin,
   quick-fading wake; slow pass = fat, lingering blob), glyphs mapped from an ASCII ramp.
   Ported from the WakeGlyph React component. The canvas is pointer-events:none, so we
   track the pointer on window and map it into the canvas. Each render recreates the
   canvas, so we tear down the old listeners/raf and re-init on the new element. */
const WAKE_RAMP=" .:-=+*#%@";
let _homeCanvasEl=null,_homeCleanup=null;
function initHomeCanvas(){
  const cv=document.getElementById('homeCanvas');
  if(cv===_homeCanvasEl)return;
  if(_homeCleanup){_homeCleanup();_homeCleanup=null;}
  _homeCanvasEl=cv;
  if(!cv)return;
  const ctx=cv.getContext('2d'); if(!ctx)return;
  const cellSize=19;
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let fg=getComputedStyle(cv).color||'rgb(233,69,53)';
  const mono="'JetBrains Mono', ui-monospace, monospace";
  let dpr=1,cols=0,rows=0,heat=new Float32Array(0),rate=new Float32Array(0),ambient=new Float32Array(0),raf=0,last=0;
  const pointer={x:-1,y:-1,t:0,has:false};
  function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    const r=cv.getBoundingClientRect(),width=r.width,height=r.height;
    cv.width=Math.max(1,Math.round(width*dpr));cv.height=Math.max(1,Math.round(height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font=(cellSize*0.85)+'px '+mono;ctx.textAlign='center';ctx.textBaseline='middle';
    cols=Math.max(1,Math.ceil(width/cellSize));rows=Math.max(1,Math.ceil(height/cellSize));
    const n=cols*rows;heat=new Float32Array(n);rate=new Float32Array(n).fill(1.4);ambient=new Float32Array(n);
    const rand=mulberry32(0xa53f9c1^(cols*71+rows));
    for(let i=0;i<n;i++){if(rand()<0.05)ambient[i]=0.16+rand()*0.22;}
  }
  function draw(){
    const r=cv.getBoundingClientRect();
    ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle=fg;
    for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
      const idx=gy*cols+gx,lum=Math.max(ambient[idx],heat[idx]);
      if(lum<=0.03)continue;
      const ch=WAKE_RAMP[Math.min(WAKE_RAMP.length-1,Math.floor(lum*(WAKE_RAMP.length-1)))];
      if(ch===' ')continue;
      ctx.globalAlpha=Math.min(1,0.3+lum*0.7);
      ctx.fillText(ch,gx*cellSize+cellSize/2,gy*cellSize+cellSize/2);
    }
    ctx.globalAlpha=1;
  }
  function stamp(px,py,radiusCells,decayRate){
    const cx=px/cellSize,cy=py/cellSize,rr=Math.max(0.6,radiusCells);
    const minGx=Math.max(0,Math.floor(cx-rr)),maxGx=Math.min(cols-1,Math.ceil(cx+rr));
    const minGy=Math.max(0,Math.floor(cy-rr)),maxGy=Math.min(rows-1,Math.ceil(cy+rr));
    for(let gy=minGy;gy<=maxGy;gy++)for(let gx=minGx;gx<=maxGx;gx++){
      const d=Math.hypot(gx+0.5-cx,gy+0.5-cy);if(d>rr)continue;
      const falloff=1-d/rr,idx=gy*cols+gx;
      if(falloff>heat[idx]){heat[idx]=falloff;rate[idx]=decayRate;}
    }
  }
  function onMove(e){
    const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    if(x<0||y<0||x>r.width||y>r.height){pointer.has=false;return;}
    const now=performance.now();
    if(pointer.has){
      const dx=x-pointer.x,dy=y-pointer.y,dist=Math.hypot(dx,dy),dt=Math.max(1,now-pointer.t),speed=dist/dt;
      const radiusCells=Math.max(0.8,Math.min(3.4,3.1/(1+speed*1.3)));
      const decayRate=Math.max(0.8,Math.min(4.5,1.0+speed*3.2));
      const steps=Math.max(1,Math.ceil(dist/(cellSize*0.5)));
      for(let s=1;s<=steps;s++){const t=s/steps;stamp(pointer.x+dx*t,pointer.y+dy*t,radiusCells,decayRate);}
    }else{stamp(x,y,2.0,1.4);}
    pointer.x=x;pointer.y=y;pointer.t=now;pointer.has=true;
  }
  function loop(now){
    const dt=last?Math.min(64,now-last)/1000:1/60;last=now;
    for(let i=0;i<heat.length;i++){if(heat[i]>0){heat[i]-=rate[i]*dt;if(heat[i]<0)heat[i]=0;}}
    draw();raf=requestAnimationFrame(loop);
  }
  resize();
  let rt=null;
  function onResize(){if(rt)clearTimeout(rt);rt=setTimeout(function(){rt=null;resize();if(reduced)draw();},150);}
  window.addEventListener('resize',onResize);
  if(reduced){draw();}
  else{window.addEventListener('pointermove',onMove);raf=requestAnimationFrame(loop);}
  _homeCleanup=function(){cancelAnimationFrame(raf);if(rt)clearTimeout(rt);window.removeEventListener('resize',onResize);window.removeEventListener('pointermove',onMove);};
}

  const today=filtered.filter(s=>(Date.now()/1000-s.ts)/3600<24);

  function sessionRow(s){

// Context estimate, used only until the server reports a real prompt_tokens count for this
// session: stable system prompt + tool schemas + the recent conversation + any live stream,
// at ~4 chars/token. It mirrors dev_server.py's _fit_context and history window, so the two
// numbers below have to track that module's CTX_HISTORY slice and char budget.
// CTX_MAX starts at the local llama build's window and is replaced by the real one as soon as
// the server sends a 'context' event (see the handler above) — the provider's declared window,
// which for an API model can be several times this. Without that replacement the gauge pegs at
// "100% full" on any model with a larger window than the local one.
let CTX_MAX=32768; const CTX_HISTORY=20;
// _fit_context trims the non-system block to MAX_INPUT_CHARS, which is 90000 chars for a 32k
// window and scales with the window from there (INPUT_CHARS_PER_CTX_TOKEN). 90000/4 ≈ 22000
// tokens, expressed as a fraction of the window so this estimate scales the same way the
// server's budget does rather than pegging at the local build's number.
const CTX_CONV_CAP_FRACTION=22000/32768;
function estimateContext(){
  const sysTok=560;                            // system prompt + platform facts (~fixed)
  const toolsTok=S.securityTools?1390:1190;    // tool schemas, measured from TOOL_SCHEMAS (~chars/4)
  // Prefer the REAL prompt-token count llama-server reported for the last turn.
  if(S.ctxUsage&&S.ctxUsage.prompt_tokens){
    const used=Math.min(S.ctxUsage.prompt_tokens,CTX_MAX);
    const convTok=Math.max(used-sysTok-toolsTok,0);
    return {sysTok,toolsTok,convTok,used,avail:Math.max(CTX_MAX-used,0),
            pct:Math.round(used/CTX_MAX*100),real:true};
  }
  const thread=S.threads[S.activeSession]||[];
  let chars=0;
  thread.slice(-CTX_HISTORY).forEach(m=>{chars+=(m.content||'').length+(m.reasoning_content||'').length;});
  chars+=(S.streamingText||'').length+(S.streamingReasoning||'').length;
  const convTok=Math.min(Math.round(chars/4),Math.round(CTX_MAX*CTX_CONV_CAP_FRACTION));
  const used=Math.min(sysTok+toolsTok+convTok,CTX_MAX);
  const avail=Math.max(CTX_MAX-used,0);
  return {sysTok,toolsTok,convTok,used,avail,pct:Math.round(used/CTX_MAX*100),real:false};
}
function renderCtxButton(){
  const c=estimateContext();
  const dash=Math.round(47.12*(c.pct/100))+' 47.12';
  const ring=c.pct>=90?A:(c.pct>=70?A75:'#ededed');
  return`<div class="hv2" data-action="toggleCtx" title="Context ${c.pct}% (${fmtTok(c.used)}/${fmtTok(CTX_MAX)} tok)" style="position:relative;display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:8px;cursor:pointer;font:500 12px 'JetBrains Mono',monospace;color:#b5b5b5">
    <svg width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="#262626" stroke-width="2.5"></circle><circle cx="10" cy="10" r="7.5" fill="none" stroke="${ring}" stroke-width="2.5" stroke-dasharray="${dash}" stroke-linecap="round" transform="rotate(-90 10 10)"></circle></svg>
    <span>${c.pct}%</span>
    ${S.ctxOpen?renderCtxPopup():''}
  </div>`;
}

function renderCtxPopup(){

  const segs=[
    {label:'System prompt',w:pc(c.sysTok),c:'#ededed',tok:fmtTok(c.sysTok)},
    {label:'Tool definitions',w:pc(c.toolsTok),c:'#7d7d7d',tok:fmtTok(c.toolsTok)},
    {label:'Conversation',w:pc(c.convTok),c:A,tok:fmtTok(c.convTok)},
    {label:'Available',w:pc(c.avail),c:'#1c1c1c',tok:fmtTok(c.avail)},

  const budgets=[
    {label:'Context used'+(c.real?' · measured':' · estimate'),v:fmtTok(c.used)+' / '+fmtTok(CTX_MAX),w:c.pct,c:c.pct>=90?A:'#ededed'},
    {label:'Reply budget',v:'3,072 tok',w:19,c:'#7d7d7d'},

    <div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin:10px 0 12px;background:#1c1c1c">${segs.map(g=>`<div style="width:${g.w}%;background:${g.c}"></div>`).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:6px">${segs.map(g=>`<div style="display:flex;align-items:center;gap:8px;font:400 12px 'Instrument Sans';color:#b5b5b5"><span style="width:8px;height:8px;border-radius:2px;background:${g.c};border:1px solid #333"></span><span style="flex:1">${g.label}</span><span style="font-family:'JetBrains Mono',monospace;color:#8a8a8a">${g.tok}</span></div>`).join('')}</div>

    <div style="display:flex;flex-direction:column;gap:12px">${budgets.map(b=>`<div><div style="display:flex;justify-content:space-between;font:500 12.5px 'Instrument Sans';color:#ddd;margin-bottom:5px"><span>${b.label}</span><span style="font:400 12px 'JetBrains Mono',monospace;color:#8a8a8a">${b.v}</span></div><div style="height:4px;background:#1c1c1c;border-radius:2px;overflow:hidden"><div style="height:100%;width:${Math.min(b.w,100)}%;background:${b.c}"></div></div></div>`).join('')}</div>
    <div style="height:1px;background:#1f1f1f;margin:14px 0"></div>
    <div class="hv2" data-action="toggleCtxDetail" style="display:inline-block;padding:5px 10px;border:1px solid #2e2e2e;border-radius:6px;cursor:pointer;font:500 12px 'Instrument Sans';color:#b5b5b5">${S.ctxDetail?'Hide details':'Show details'}</div>

  </div>`;
}

/* Messages */
function renderMessage(m,idx,thread){
  if(m.role==='user'){
    return`<div class="lai-in"><div style="display:flex;justify-content:flex-end"><div style="max-width:78%;background:oklch(62% 0.21 25 / .12);border:1px solid oklch(62% 0.21 25 / .3);border-radius:14px 14px 4px 14px;padding:12px 18px;font:400 16px/1.6 'Instrument Sans';white-space:pre-wrap">${esc(m.content)}</div></div></div>`;
  }
  if(m.role==='system'){
    if(m.content&&(m.content.startsWith('⏳ Awaiting approval')||m.content.startsWith('Steer:')))return'';
    return`<div class="lai-in" style="text-align:center;font:400 14px 'Instrument Sans';color:#8a8a8a">${esc(m.content)}</div>`;
  }
  if(m.role==='assistant'){
    const text=m.content||'';
    const reasoning=m.reasoning_content||'';
    const toolCalls=m.extra?.tool_calls||m.tool_calls||[];
    const isPlaceholder=text.startsWith('(calling tools');  // matches both '...' and '…'
    if(isPlaceholder&&toolCalls.length===0)return'';
    const prevIsAsst=idx>0&&thread[idx-1].role==='assistant';
    const chainKey='chain_'+idx;
    const chainOpen=S.chainOpen[chainKey]!==false;
    const hasChain=toolCalls.length>0||reasoning;

    return`<div class="lai-in">
      <div style="display:flex;gap:14px">
        <div style="flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin-top:1px;visibility:${prevIsAsst?'hidden':'visible'}">
          <img src="${LOGO}" alt="" style="width:26px;height:auto;display:block">
        </div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:14px">
          ${hasChain?`<div data-action="toggleChain" data-key="${chainKey}" style="align-self:flex-start;display:flex;align-items:center;gap:9px;cursor:pointer;color:#9a9a9a;white-space:nowrap;font:400 15px 'Instrument Sans'" class="hv-color">
            <span>${toolCalls.length?('Used <span style="font:400 13.5px \'JetBrains Mono\',monospace">'+toolCalls.length+'</span> tool'+(toolCalls.length>1?'s':'')):'Reasoning'}</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6;transform:${chainOpen?'rotate(0)':'rotate(-90deg)'};transition:transform .25s"><path d="M6 9l6 6 6-6"></path></svg>
          </div>`:''}
          ${chainOpen&&hasChain?`<div style="display:flex;flex-direction:column;gap:2px;margin-left:7px;padding-left:14px;border-left:1px solid #1f1f1f">
            ${reasoning?renderReasoningStep(reasoning):''}
            ${toolCalls.map((tc,ti)=>{
              let result=null;
              for(let j=idx+1;j<thread.length&&j<=idx+toolCalls.length;j++){
                if(thread[j].role==='tool'){
                  const tn=thread[j].extra?.tool_name||thread[j].tool_name||'';
                  const tcn=tc.function?.name||tc.name||'';
                  if(tn===tcn||j===idx+1+ti){result=thread[j].content;break;}
                }
              }
              return renderToolCallStep(tc,result);
            }).join('')}
          </div>`:''}
          ${text&&!isPlaceholder?`<div class="${m._streaming?'lai-caret':''}" style="font:400 16.5px/1.75 'Instrument Sans';color:#d4d4d4;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:10px">${md(text)}</div>`:''}
          <div style="display:flex;gap:2px;margin-top:-4px">
            <div class="hv2" data-action="copyMsg" data-text="${esc(text)}" style="display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:6px;cursor:pointer;font:500 11.5px 'Instrument Sans';color:#8a8a8a">${icons.copySm}Copy</div>
            <div class="hv2" data-action="regenMsg" style="display:flex;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;color:#8a8a8a">${icons.regen}</div>
            <div class="hv2" data-action="likeMsg" data-idx="${idx}" style="display:flex;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;color:${S.liked[idx]?A70:'#8a8a8a'}">${icons.thumbUp}</div>
          </div>
        </div>
      </div>
    </div>`;
  }
  if(m.role==='tool'){
    // Tool results are now rendered inside the preceding assistant's tool chain
    // Only show standalone if no preceding assistant with tool_calls
    const prev=idx>0?thread[idx-1]:null;
    if(prev&&prev.role==='assistant'&&(prev.extra?.tool_calls||prev.tool_calls||[]).length)return'';
    const name=m.extra?.tool_name||m.tool_name||'tool';
    return`<div class="lai-in" style="margin-left:40px">
      <div style="border:1px solid #1f1f1f;border-radius:10px;overflow:hidden;background:#070707;font:400 12.5px 'JetBrains Mono',monospace">
        <div style="display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #1a1a1a;background:#0c0c0c"><span style="color:#8a8a8a">$</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ededed;font-weight:500">${esc(name)}</span></div>
        <div style="padding:10px 12px;overflow-x:auto;line-height:1.65;max-height:200px;overflow-y:auto"><pre style="margin:0;white-space:pre-wrap;color:#9a9a9a">${esc(m.content)}</pre></div>
      </div>
    </div>`;
  }
  return`<div class="lai-in" style="text-align:center;font:400 13px 'Instrument Sans';color:#8a8a8a">${esc(m.content||JSON.stringify(m))}</div>`;
}

function renderReasoningStep(reasoning,opts){
  opts=opts||{};const open=!!opts.open,active=!!opts.active,key=opts.key||'';
  return`<div style="display:flex;flex-direction:column">
    <div ${key?`data-action="toggleStep" data-key="${key}"`:''} class="hv2" style="display:flex;align-items:center;gap:10px;min-height:34px;padding:0 8px;border-radius:8px;cursor:${key?'pointer':'default'}">
      <span style="flex:none;width:16px;height:16px;display:flex;align-items:center;justify-content:center">${icons.think}</span>
      ${active?`<span class="lai-shimmer" style="font:500 15px 'Instrument Sans'">Thinking…</span>`:`<span style="flex:none;font:500 15px 'Instrument Sans';color:#ededed">Thought</span>`}
      ${key?`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5;transform:${open?'rotate(0)':'rotate(-90deg)'};transition:transform .25s"><path d="M6 9l6 6 6-6"></path></svg>`:''}
    </div>
    ${open?`<div style="margin:2px 0 10px 16px;padding-left:14px;border-left:1px solid #1f1f1f">
      <div style="font:400 14.5px/1.65 'Instrument Sans';color:#9a9a9a;white-space:pre-wrap">${esc(reasoning)}</div>
    </div>`:''}
  </div>`;
}

function _toolMeta(tc){
  const name=tc.function?.name||tc.name||'tool';
  const rawArgs=tc.function?.arguments||tc.arguments||{};
  let args;try{args=typeof rawArgs==='string'?JSON.parse(rawArgs):rawArgs}catch(e){args={}}
  const map={
    run_command:{label:'Run',icon:icons.cmd,secondary:args.command||'',mono:true},
    http_request:{label:(args.method||'GET'),icon:icons.web,secondary:args.url||'',mono:true},
    read_file:{label:'Read',icon:icons.file,secondary:args.path||'',mono:true},
    write_file:{label:'Edit',icon:icons.file,secondary:args.path||'',mono:true},
    knowledge_search:{label:'Knowledge base',icon:icons.rag,secondary:args.query?'"'+args.query+'"':'',mono:false},
    record_hypothesis:{label:'Hypothesis',icon:icons.stepDone,secondary:args.title||'',mono:false},
    update_hypothesis_status:{label:'Update hypothesis',icon:icons.stepDone,secondary:args.hypothesis_id||'',mono:true},
    record_finding:{label:'Finding',icon:icons.stepDone,secondary:args.title||'',mono:false},
  };
  const m=map[name]||{label:name,icon:icons.stepDone,secondary:JSON.stringify(args).slice(0,60),mono:true};
  return{name,args,label:m.label,icon:m.icon,secondary:m.secondary,mono:m.mono};
}
function renderToolCallStep(tc,toolResult,opts){
  opts=opts||{};const open=opts.open!==undefined?opts.open:true,active=!!opts.active,key=opts.key||'';
  const m=_toolMeta(tc);
  const ff=m.mono?"'JetBrains Mono',monospace":"'Instrument Sans',sans-serif";
  const isCmd=m.name==='run_command';
  // Parse ONCE, guarded. The server may truncate large results, so toolResult can be
  // invalid JSON — a thrown parse here would crash the whole render and freeze the UI.
  let parsed=null;
  if(toolResult){try{parsed=typeof toolResult==='string'?JSON.parse(toolResult):toolResult}catch(e){parsed=null}}
  // Plain-text output for both the inline block and the side panel.
  let outText='';
  if(toolResult){
    if(parsed&&isCmd)outText=(parsed.output||parsed.error||'');
    else if(parsed)outText=(parsed.content||parsed.error||parsed.output||JSON.stringify(parsed,null,2));
    else outText=String(toolResult);
  }
  let resultBlock='';
  if(toolResult&&open){
    if(parsed&&isCmd){
      const exit=parsed.exit_code??0;
      const exitColor=exit===0?'#8a8a8a':'oklch(70% 0.19 25)';
      const lines=outText.split('\n').filter(l=>l);
      resultBlock=`<div style="margin:4px 0 8px 16px;padding-left:14px;border-left:1px solid #1f1f1f">
        <div style="border:1px solid #1f1f1f;border-radius:10px;overflow:hidden;background:#070707;font:400 12.5px 'JetBrains Mono',monospace">
          <div style="display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid #1a1a1a;background:#0c0c0c">
            <span style="color:#8a8a8a;font-weight:700">$</span>
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ededed;font-weight:500">${esc(m.secondary)}</span>
            <span style="padding:1px 7px;border-radius:5px;font-size:11px;background:#141414;color:${exitColor}">exit ${exit}</span>
          </div>
          <div style="padding:10px 12px;overflow-x:auto;line-height:1.65;max-height:200px;overflow-y:auto">${lines.map(l=>{
            const c=/FATAL|failed|Error|error/i.test(l)?'oklch(70% 0.19 25)':/WARN|warning/i.test(l)?'oklch(78% 0.1 60)':/✓|open|finished|done|ok/i.test(l)?'#ededed':'#9a9a9a';
            return`<div style="white-space:pre;color:${c}">${esc(l)}</div>`;
          }).join('')}</div>
        </div>
      </div>`;
    } else {
      resultBlock=`<div style="margin:4px 0 8px 16px;padding-left:14px;border-left:1px solid #1f1f1f">
        <div style="font:400 13px/1.55 'Instrument Sans';color:#9a9a9a;white-space:pre-wrap;max-height:160px;overflow-y:auto">${esc(outText.slice(0,1500))}</div>
      </div>`;
    }
  }
  const stLabel=toolResult?((isCmd&&parsed&&parsed.exit_code)?'FAILED':'DONE'):(active?'':'');
  const stColor=stLabel==='FAILED'?'oklch(70% 0.19 25)':'#9a9a9a';
  const spinner=active&&!toolResult?`<span class="lai-spin" style="margin-left:auto;width:13px;height:13px;border-radius:50%;border:1.5px solid #333;border-top-color:#fff;display:block"></span>`:'';
  const chev=key?`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5;transform:${open?'rotate(0)':'rotate(-90deg)'};transition:transform .25s"><path d="M6 9l6 6 6-6"></path></svg>`:'';
  // Panel opener carries both the command/url (input) and the captured output.
  const panelAttrs=`data-action="openToolPanel" data-name="${esc(m.name)}" data-input="${esc(m.secondary||JSON.stringify(m.args))}" data-output="${esc(outText.slice(0,8000))}"`;
  return`<div style="display:flex;flex-direction:column">
    <div ${key?`data-action="toggleStep" data-key="${key}"`:''} style="display:flex;align-items:center;gap:10px;min-height:34px;padding:0 8px;border-radius:8px;cursor:pointer" class="hv2">
      <span style="flex:none;width:16px;height:16px;display:flex;align-items:center;justify-content:center">${m.icon}</span>
      <span style="flex:none;font:500 15px 'Instrument Sans';color:#ededed">${esc(m.label)}</span>
      ${m.secondary?`<span style="min-width:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#0d0d0d;border:1px solid #1f1f1f;border-radius:7px;padding:2px 9px;font:400 13px ${ff};color:#9a9a9a">${esc(m.secondary.slice(0,80))}</span>`:''}
      ${spinner}
      ${stLabel?`<span style="margin-left:auto;font:600 11px 'Instrument Sans';text-transform:uppercase;letter-spacing:.05em;color:${stColor}">${stLabel}</span>`:''}
      ${chev}
      <span ${panelAttrs} title="Open input/output" style="flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#8a8a8a;cursor:pointer;border:1px solid #1f1f1f" class="hv2 hv-color">${icons.panelSide}</span>
    </div>
    ${resultBlock}
  </div>`;
}

/* Group a whole agent turn (everything between two user messages) into ONE collapsible
   activity block — shimmer "Working…" while live, "Worked for Ns" collapsed when done —
   instead of one "Used 1 tool" card per message. Matches the chat-animation design. */
function renderThread(thread){
  const parts=[];let i=0;
  while(i<thread.length){
    if(thread[i].role==='user'){parts.push(renderMessage(thread[i],i,thread));i++;continue;}
    let j=i;while(j<thread.length&&thread[j].role!=='user')j++;
    parts.push(renderAgentGroup(thread,i,j,j>=thread.length));
    i=j;
  }
  return parts.join('');
}
function renderAgentGroup(thread,start,end,isLast){
  const running=isLast&&S.running;
  const stepList=[];let finalText='',durSecs=null,sysLines='';
  for(let k=start;k<end;k++){
    const m=thread[k];
    if(m.role==='assistant'){
      const text=m.content||'',reasoning=m.reasoning_content||'';
      const toolCalls=m.extra?.tool_calls||m.tool_calls||[];
      const isPlaceholder=text.startsWith('(calling tools');
      if(reasoning)stepList.push({kind:'reasoning',reasoning});
      toolCalls.forEach((tc,ti)=>{
        let result=null;
        for(let j=k+1;j<end&&j<=k+toolCalls.length;j++){
          if(thread[j].role==='tool'){
            const tn=thread[j].extra?.tool_name||thread[j].tool_name||'';
            const tcn=tc.function?.name||tc.name||'';
            if(tn===tcn||j===k+1+ti){result=thread[j].content;break;}
          }
        }
        stepList.push({kind:'tool',tc,result});
      });
      if(text&&!isPlaceholder)finalText=text;
      if(m._durSecs!=null)durSecs=m._durSecs;
    } else if(m.role==='system'){
      const c=m.content||'';
      if(c.startsWith('⏳ Awaiting approval')||c.startsWith('Steer:')||c.startsWith('['))continue;
      sysLines+=`<div style="font:400 13px 'Instrument Sans';color:#8a8a8a;padding:2px 0">${esc(c)}</div>`;
    }
  }
  const key='turn_'+start;
  // Per-step: a tool still awaiting its result is "active" (open + spinner); everything
  // finished collapses to its header. Reasoning collapses to "Thought" once committed.
  let steps='';const hasSteps=stepList.length>0;
  stepList.forEach((st,i)=>{
    const sk=key+':'+i;
    if(st.kind==='reasoning'){
      const sopen=S.stepOpen[sk]===true;
      steps+=renderReasoningStep(st.reasoning,{key:sk,open:sopen,active:false});
    } else {
      const active=running&&(st.result==null);
      const sopen=active?true:(S.stepOpen[sk]===true);
      steps+=renderToolCallStep(st.tc,st.result,{key:sk,open:sopen,active});
    }
  });
  const toolN=stepList.filter(s=>s.kind==='tool').length;
  const open=running?true:(S.chainOpen[key]===true);
  let liveTail='';
  if(running){
    if(S.streamingReasoning&&!S.streamingText){
      liveTail+=`<div style="display:flex;flex-direction:column">
        <div style="display:flex;align-items:center;gap:10px;min-height:34px;padding:0 8px"><span style="flex:none;width:16px;height:16px;display:flex;align-items:center;justify-content:center">${icons.think}</span><span class="lai-shimmer" style="font:500 15px 'Instrument Sans'">Thinking…</span></div>
        <div style="margin:2px 0 10px 16px;padding-left:14px;border-left:1px solid #1f1f1f"><div id="streaming-reasoning" style="font:400 14.5px/1.65 'Instrument Sans';color:#9a9a9a;white-space:pre-wrap;overflow-wrap:anywhere">${esc(S.streamingReasoning)}</div></div></div>`;
    }
    if(S.streamingText){
      liveTail+=`<div id="streaming-content" style="font:400 16.5px/1.75 'Instrument Sans';color:#d4d4d4;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:10px">${md(S.streamingText)}<span class="lai-caret"></span></div>`;
    }
  }
  const headerInner=running
    ?`<span class="lai-px"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="lai-shimmer" style="font-weight:500">Working…</span>`
    :`<span>Worked${durSecs!=null?` for <span style="font:400 13.5px 'JetBrains Mono',monospace">${durSecs}</span>s`:''}</span>`;
  const header=hasSteps?`<div data-action="toggleChain" data-key="${key}" style="align-self:flex-start;display:flex;align-items:center;gap:9px;cursor:pointer;color:#9a9a9a;white-space:nowrap;font:400 15px 'Instrument Sans'" class="hv-color">
      ${headerInner}
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.6;transform:${open?'rotate(0)':'rotate(-90deg)'};transition:transform .25s"><path d="M6 9l6 6 6-6"></path></svg>
    </div>`:'';
  const body=(open&&hasSteps)?`<div style="display:flex;flex-direction:column;gap:2px;margin-left:7px;padding-left:14px;border-left:1px solid #1f1f1f">${steps}</div>`:'';
  const answer=(finalText&&!running)?`<div style="font:400 16.5px/1.75 'Instrument Sans';color:#d4d4d4;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:10px">${md(finalText)}</div>
    <div style="display:flex;gap:2px;margin-top:-4px">
      <div class="hv2" data-action="copyMsg" data-text="${esc(finalText)}" style="display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:6px;cursor:pointer;font:500 11.5px 'Instrument Sans';color:#8a8a8a">${icons.copySm}Copy</div>

function nodeVisual(n){
  const status=n.status||'open';const verdict=n.verdict||'';
  let bg='#0a0a0a',border='2px solid #333',fg='#b5b5b5',glyph='',gc='#9a9a9a',op=1,cls='';
  if(status==='completed'){bg='#141414';
    if(verdict==='confirmed'||verdict==='supported'){border='2px solid #ededed';fg='#fff';glyph='✓';gc='#fff';}
    if(verdict==='refuted'){border='2px solid '+A70;fg=A70;bg='oklch(62% 0.21 25 / .12)';glyph='✕';gc=A70;}}
  if(status==='parked'){border='2px dashed #444';op=.5;}
  if(status==='abandoned'){op=.35;glyph='⊗';}
  if(status==='running'){border='2px dashed '+A70;cls='lai-pulse';}
  if(status==='awaiting_approval'){border='3px solid '+A70;glyph='!';gc=A70;}
  return{bg,border,fg,glyph,gc,op,cls,dot:verdict==='refuted'?A70:(verdict==='confirmed'||verdict==='supported'?'#ededed':(status==='running'?A70:'#555'))};
}

function renderGraphTree(nodes,edges){
  if(!nodes.length){
    return`<div style="flex:1;display:flex;align-items:center;justify-content:center;font:400 14px 'Instrument Sans';color:#8a8a8a">No hypotheses yet. They appear here as the agent forms them.</div>`;
  }
  const F=S.gFilter||{};
  const by=Object.fromEntries(nodes.map(n=>[n.ordinal||n.id,n]));
  const idOf=n=>n.ordinal||n.id;
  const parentOf=n=>n.parent_ordinal;
  const depth=n=>{let d=0,c=n,g=0;while(c&&parentOf(c)!=null&&by[parentOf(c)]&&g++<64){d++;c=by[parentOf(c)];}return d;};

  /* active path: from the running node up to its root */
  const run=nodes.find(n=>(n.status||'')==='running');
  const act=new Set();{let c=run,g=0;while(c&&g++<64){act.add(idOf(c));c=(parentOf(c)!=null)?by[parentOf(c)]:null;}}

  /* collapse → hidden descendants */
  const collapsed=S.collapsed||{};
  const kidsOf=id=>nodes.filter(n=>parentOf(n)===id);
  const hidden=new Set();
  const hide=id=>kidsOf(id).forEach(k=>{hidden.add(idOf(k));hide(idOf(k));});
  Object.keys(collapsed).filter(k=>collapsed[k]).forEach(k=>hide(isNaN(+k)?k:+k));
  const vis=nodes.filter(n=>!hidden.has(idOf(n)));
  const visSet=new Set(vis.map(idOf));

  /* tidy tree: chains stay horizontal, colliding siblings drop to the next free row in their column */
  const COL=180,ROW=120;
  const childrenOf=id=>vis.filter(n=> id===null ? (parentOf(n)==null||!visSet.has(parentOf(n))) : parentOf(n)===id);
  const rowOf={},takenAt={};let maxRow=-1;
  const claim=(d,want)=>{takenAt[d]=takenAt[d]||new Set();let r=Math.max(0,want);while(takenAt[d].has(r))r++;takenAt[d].add(r);maxRow=Math.max(maxRow,r);return r;};
  const walk=(n,want)=>{const d=depth(n);const r=rowOf[idOf(n)]=claim(d,want);childrenOf(idOf(n)).forEach((k,i)=>walk(k,i===0?r:maxRow+1));};
  childrenOf(null).forEach(n=>walk(n,maxRow+1));
  const pos={};vis.forEach(n=>{pos[idOf(n)]={x:40+depth(n)*COL,y:70+(rowOf[idOf(n)]||0)*ROW};});
  const W=Math.max(...Object.values(pos).map(p=>p.x),0)+240;
  const H=Math.max(...Object.values(pos).map(p=>p.y),0)+150;

  /* filter → dim (positions unchanged) */
  const match=n=>{
    if(F.q){const q=F.q.toLowerCase();if(!(('h'+idOf(n)+' '+(n.title||'')+' '+(n.claim||n.description||'')+' '+(n.phase||'')).toLowerCase().includes(q)))return false;}
    if(F.phase&&(n.phase||'').toUpperCase()!==F.phase)return false;
    if(F.status){if(F.status.startsWith('v:')){if((n.verdict||'')!==F.status.slice(2))return false;}else if((n.status||'open')!==F.status)return false;}
    if(F.conf&&(n.confidence||'medium')!==F.conf)return false;
    if(F.activeOnly&&!act.has(idOf(n)))return false;
    return true;
  };
  const anyFilter=F.q||F.phase||F.status||F.conf||F.activeOnly;

  /* generation labels across the top */
  const gens=[...new Set(vis.map(depth))].sort((a,b)=>a-b);
  const genEls=gens.map(d=>`<div style="position:absolute;top:14px;left:${40+d*COL+54}px;transform:translateX(-50%);font:600 11px 'JetBrains Mono',monospace;color:#8a8a8a;text-transform:uppercase;letter-spacing:.08em">Gen ${d}</div>`).join('');

  /* edges — active-path links are red + thicker, exactly like the design */
  const edgePaths=vis.map(n=>{
    const pid=parentOf(n);if(pid==null||!pos[pid])return'';
    const a=pos[pid],b=pos[idOf(n)];
    const on=act.has(idOf(n))&&act.has(pid);
    const dim=anyFilter&&!(match(n)&&match(by[pid]));
    const x1=a.x+79,y1=a.y+25,x2=b.x+29,y2=b.y+25,mx=(x1+x2)/2;
    return`<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="${on?A70:(dim?'#161616':'#2a2a2a')}" stroke-width="${on?2.5:1.5}"/>`;
  }).join('');

  const nodeEls=vis.map(n=>{
    const p=pos[idOf(n)];if(!p)return'';
    const sel=S.selectedNode===idOf(n);
    const v=nodeVisual(n);
    const id=idOf(n);
    const verd=n.verdict||'',st=n.status||'open';
    let phaseCol='#8a8a8a',titleCol='#b5b5b5';
    if(verd==='refuted'){phaseCol=A70;titleCol=A70;}
    else if(st==='running'||st==='awaiting_approval'){phaseCol='#ededed';titleCol='#ededed';}
    let op=v.op;if(anyFilter&&!match(n))op=.18;
    const kc=kidsOf(id).length;
    const ring=sel?'0 0 0 3px rgba(255,255,255,.22)':'none';
    return`<div data-action="selectNode" data-ordinal="${id}" style="position:absolute;left:${p.x}px;top:${p.y}px;width:108px;cursor:pointer;opacity:${op};display:flex;flex-direction:column;align-items:center;gap:5px;user-select:none" title="${esc(n.title||n.claim||'')}">
      <div class="${v.cls}" style="width:50px;height:50px;border-radius:50%;background:${v.bg};border:${v.border};display:flex;align-items:center;justify-content:center;font:600 15px 'JetBrains Mono',monospace;color:${v.fg};position:relative;box-shadow:${ring}">${id}
        ${v.glyph?`<span style="position:absolute;bottom:-3px;right:-3px;min-width:16px;height:16px;padding:0 2px;border-radius:8px;background:#000;display:flex;align-items:center;justify-content:center;font:700 11px 'Instrument Sans';color:${v.gc}">${v.glyph}</span>`:''}
        ${kc>0?`<span data-action="toggleCollapse" data-ordinal="${id}" style="position:absolute;top:-4px;right:-10px;background:#111;border:1px solid #2e2e2e;border-radius:8px;padding:1px 6px;font:600 11px 'JetBrains Mono',monospace;color:#9a9a9a;cursor:pointer">${collapsed[id]?'+'+kc:'−'}</span>`:''}
      </div>
      <div style="font:600 11px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:${phaseCol}">${esc(n.phase||'')}</div>
      <div style="font:500 11px/1.25 'Instrument Sans';color:${titleCol};text-align:center;max-width:104px">${esc(n.title||'')}</div>
    </div>`;
  }).join('');

  /* minimap */
  const mmW=150,mmH=Math.max(60,Math.min(150,Math.round(mmW*H/Math.max(W,1))));
  const mmDots=vis.map(n=>{const p=pos[idOf(n)];if(!p)return'';const v=nodeVisual(n);return`<span style="position:absolute;left:${Math.round((p.x+27)/W*mmW)}px;top:${Math.round((p.y+25)/H*mmH)}px;width:4px;height:4px;border-radius:50%;background:${v.dot};opacity:${anyFilter&&!match(n)?.2:1}"></span>`;}).join('');

  const activePath=[...act].map(i=>'H'+i).join(' → ')||'—';

  return graphFilterBar()+`
  <div style="padding:8px 20px;font:400 12.5px 'Instrument Sans';color:#7d7d7d;border-bottom:1px solid #1a1a1a;flex:none">Active path: <span style="color:${A70};font-family:'JetBrains Mono',monospace;font-weight:500">${esc(activePath)}</span></div>
  <div style="flex:1;display:flex;min-height:0;position:relative">
    <div style="position:absolute;left:0;right:${S.nodeDetail?'380':'0'}px;bottom:12px;height:0;overflow:visible;z-index:15;pointer-events:none">
      <div style="position:absolute;left:12px;bottom:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:auto">
        <div style="background:rgba(6,6,6,.94);border:1px solid #1f1f1f;border-radius:10px;padding:8px 12px;display:flex;gap:14px;font:400 11.5px 'Instrument Sans';color:#9a9a9a;white-space:nowrap;overflow-x:auto;scrollbar-width:none"><span>◯ open</span><span style="color:${A70}">◌ running</span><span>◌ parked</span><span style="color:#ededed">● confirmed / supported</span><span style="color:${A70}">● refuted</span><span>⊗ abandoned</span></div>
      </div>
      <div style="position:absolute;right:12px;bottom:0;pointer-events:auto"><div style="position:relative;width:${mmW}px;height:${mmH}px;background:rgba(6,6,6,.94);border:1px solid #2e2e2e;border-radius:6px">${mmDots}</div></div>
    </div>
    <div style="flex:1;overflow:auto;position:relative;cursor:grab;min-width:0" id="graphCanvas">
      <div style="position:relative;width:${W}px;height:${H}px;transform:scale(${S.graphZoom});transform-origin:0 0;background:radial-gradient(circle at 1px 1px,#1c1c1c 1px,transparent 0) 0 0/22px 22px,#000">
        <svg width="${W}" height="${H}" style="position:absolute;inset:0;pointer-events:none">${edgePaths}</svg>
        ${genEls}
        ${nodeEls}
      </div>
    </div>
    ${S.nodeDetail?renderNodeDrawer():''}
  </div>`;
}

function renderNodeDrawer(){
  const n=S.nodeDetail;if(!n)return'';
  const status=n.status||'open';const verdict=n.verdict||'';const attempts=n.attempts||[];
  const conf=n.confidence||'medium';
  const confDots=conf==='high'?'●●●':(conf==='medium'?'●●○':'●○○');
  const tier=n.priority||'p2';
  const tierColors={p0:['oklch(62% 0.21 25 / .16)',A70],p1:['#1c1c1c','#ededed'],p2:['#141414','#9a9a9a'],p3:['#111','#7d7d7d']};
  const tc=tierColors[tier]||tierColors.p2;

/* Notes Tab */
function renderNotesTab(){

    if(S.noteCat!=='all'&&n.category!==S.noteCat)return false;
    if(q&&!(n.text||'').toLowerCase().includes(q))return false;return true;

  const ntag={technique:['#1c1c1c','#fff'],'dead-end':['oklch(62% 0.21 25 / .16)',A70],todo:['#1c1c1c','#b5b5b5'],observation:['#141414','#7d7d7d']};
  return`<div style="flex:1;display:flex;flex-direction:column;min-height:0">

      <div style="display:flex;gap:5px;flex-wrap:wrap">

      <div style="margin-left:auto;font:600 11px 'Instrument Sans';padding:4px 9px;border-radius:999px;cursor:pointer;background:#111;color:#7d7d7d" class="hv-color">★ Techniques (global)</div>

        return`<div style="display:flex;gap:12px;padding:11px 13px;border:1px solid #1f1f1f;border-radius:10px;background:#0a0a0a;margin-bottom:8px;opacity:${n.resolved?'.45':'1'}">

      <div style="font:600 15px 'Instrument Sans';margin-bottom:8px">API key</div>
      <div style="font:400 13px/1.6 'Instrument Sans';color:#9a9a9a;margin-bottom:12px">Needed only when the server runs with WEB_UI_API_KEY_FILE. Stored in this browser.</div>
      <input id="apiKeyInput" type="password" value="${esc(S.apiKey)}" placeholder="Paste key" style="width:100%;background:#111;border:1px solid #262626;border-radius:7px;padding:8px 10px;font:400 13px 'JetBrains Mono',monospace;color:#ededed;outline:none">
      <div style="display:flex;gap:8px;margin-top:16px">
        <button data-action="closeModal" style="flex:1;padding:8px;border:1px solid #2e2e2e;border-radius:7px;background:transparent;color:#ededed;font:500 13px 'Instrument Sans';cursor:pointer">Cancel</button>
        <button data-action="saveKey" style="flex:1;padding:8px;border:none;border-radius:7px;background:${A};color:#000;font:600 13px 'Instrument Sans';cursor:pointer">Save</button>
      </div>
    </div>`;
  }else if(S.modal==='help'){
    const shortcuts=[['Ctrl/⌘ K','Search sessions'],['Enter','Send message'],['Shift Enter','New line'],['Esc','Close drawer, modal or graph'],['← ↑ ↓ →','Move between hypotheses'],['?','Show this list']];
    content=`<div>
      <div style="font:600 15px 'Instrument Sans';margin-bottom:12px">Keyboard shortcuts</div>
      ${shortcuts.map(([k,d])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #161616;font:400 13px 'Instrument Sans';color:#b5b5b5"><span>${esc(d)}</span><span style="font:500 12px 'JetBrains Mono',monospace;color:#fff">${esc(k)}</span></div>`).join('')}
    </div>`;
  }
  return`<div data-action="modalBackdrop" style="position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center">
    <div class="lai-in" style="width:420px;max-width:calc(100vw - 32px);max-height:80vh;overflow-y:auto;background:#0a0a0a;border:1px solid #2e2e2e;border-radius:14px;padding:18px">${content}</div>
  </div>`;
}

/* Toast */
function renderToast(){
  if(!S.toast)return'';
  return`<div role="status" style="position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;padding:10px 16px;background:#111;border:1px solid #2e2e2e;border-radius:10px;font:500 13px 'Instrument Sans';box-shadow:0 12px 32px #000">${esc(S.toast)}</div>`;
}

/* EVENT DELEGATION */
document.getElementById('app').addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const action=el.dataset.action;
  if(action==='stopProp'){e.stopPropagation();return;}
  switch(action){
    case 'toggleSidebar': S.sidebarOpen=!S.sidebarOpen; render(); break;
    case 'goHome': goHome(); break;
    case 'toggleApprovals': S.approvalsOpen=!S.approvalsOpen; if(S.approvalsOpen)pollApprovals(); render(); break;
    case 'openSession': openSession(el.dataset.id); break;
    case 'deleteSession': deleteSession(el.dataset.id,e); break;
    case 'send': sendMessage(); break;
    case 'stopRun': stopRun(); break;
    case 'openGraph': openGraph(); break;
    case 'closeGraph': stopGraphPoll(); S.view='chat'; S.selectedNode=null; S.nodeDetail=null; render(); break;
    case 'toggleSteer': S.steerOpen=!S.steerOpen; render(); break;
    case 'sendSteer': sendSteer(); break;
    case 'copySessionId': if(S.activeSession){copyText(S.activeSession);S.idCopied=true;render();setTimeout(()=>{S.idCopied=false;render()},1200);} break;
    case 'openMenu': S.menu=S.menu===el.dataset.key?null:el.dataset.key; render(); break;
    case 'pickMenu': {
      const key=el.dataset.key, val=el.dataset.value;
      if(key==='sec')S.securityTools=val==='true';
      else if(key==='iso'){if(val==='direct'&&S.isolation!=='direct'){S.modal='direct';S.menu=null;render();return;}S.isolation=val;}
      else if(key==='mode')S.mode=val;
      else if(key==='think'){S.thinking=val==='true';if(S.activeSession)api.setThinking(S.activeSession,S.thinking).catch(()=>{});}
      S.menu=null; render();
    } break;
    case 'openEngagements': S.modal='list'; S.menu=null; loadEngagements(); render(); break;
    case 'pickEngagement': S.engagementId=el.dataset.id; S.modal=null; render(); break;
    case 'newEngagement': S.modal='new'; S.newEng={id:'',scope:'',deny:'',error:''}; render(); break;
    case 'backEng': S.modal='list'; render(); break;
    case 'saveEng': saveEngagement(); break;
    case 'closeModal': S.modal=null; render(); break;
    case 'modalBackdrop': if(e.target===el){S.modal=null;render();} break;
    case 'openKey': S.modal='key'; render(); break;
    case 'openHelp': S.modal='help'; render(); break;
    case 'openSettings': S.modal='settings'; render(); break;
    case 'toggleThinking': {
      S.thinking=!S.thinking;
      if(S.activeSession)api.setThinking(S.activeSession,S.thinking).catch(()=>{});
      render();
    } break;
    case 'saveKey': {
      const inp=document.getElementById('apiKeyInput');
      if(inp)S.apiKey=inp.value;
      try{localStorage.setItem('webUiApiKey',S.apiKey)}catch(e){}
      S.modal=null; toast('API key saved'); render();
    } break;
    case 'setStage': {
      const st=el.dataset.stage; S.stage=st; render();
      if(S.activeSession)api.setStage(S.activeSession,st).then(()=>toast('Stage → '+st)).catch(e=>toast('Failed: '+e.message));
    } break;
    case 'toggleCtx': S.ctxOpen=!S.ctxOpen; render(); break;
    case 'toggleCtxDetail': S.ctxDetail=!S.ctxDetail; render(); break;
    case 'compactCtx': toast('Context compacted'); S.ctxOpen=false; render(); break;
    case 'confirmDirect': {const inp=document.getElementById('confirmDirectInput');if(inp&&inp.value.trim()==='direct'){S.isolation='direct';S.modal=null;toast('Isolation set to direct');render();}else{toast('Type "direct" to confirm')}} break;
    case 'toggleConn': S.conn=S.conn==='online'?'offline':'online'; render(); break;
    case 'retryConn': S.conn='reconnecting'; render(); if(S.activeSession)connectSSE(S.activeSession); break;
    case 'closePanel': S.panel=null; render(); break;
    case 'openToolPanel': S.panel={name:el.dataset.name,input:el.dataset.input||el.dataset.args||'',output:el.dataset.output||''}; render(); break;
    case 'toggleStep': {const k=el.dataset.key;S.stepOpen[k]=!(S.stepOpen[k]===true);render();} break;
    case 'copyMsg': copyText(el.dataset.text); break;
    case 'scrollBottom': scrollToBottom(); render(); break;
    case 'setGraphTab': {
      S.graphTab=el.dataset.tab;
      if(el.dataset.tab==='notes')loadNotebook();
      if(el.dataset.tab==='findings')loadFindings();
      render();
    } break;
    case 'selectNode': selectGraphNode(parseInt(el.dataset.ordinal)); break;
    case 'closeNodeDrawer': S.selectedNode=null; S.nodeDetail=null; render(); break;
    case 'toggleStats': S.statsOpen=!S.statsOpen; render(); break;
    case 'zoomIn': S.graphZoom=Math.min(2.6,S.graphZoom*1.2); render(); break;
    case 'zoomOut': S.graphZoom=Math.max(0.3,S.graphZoom/1.2); render(); break;
    case 'zoomReset': S.graphZoom=1; render(); break;
    case 'clearGraphFilters': S.gFilter={q:'',phase:'',status:'',conf:'',activeOnly:false}; render(); break;
    case 'toggleCollapse': {const o=el.dataset.ordinal;S.collapsed[o]=!S.collapsed[o];render();} break;
    case 'graphNodeAction': {
      const ord=parseInt(el.dataset.ordinal), act=el.dataset.act;
      if(act==='park'){const reason=prompt('Reason for parking:');if(reason)graphNodeAction(ord,'park',reason);}
      else if(act==='reopen'){graphNodeAction(ord,'reopen');}
      else if(act==='note'){const text=prompt('Note text:');if(text)graphNodeAction(ord,'note','',text);}
    } break;
    case 'setNoteCat': S.noteCat=el.dataset.cat; render(); break;
    case 'resolveNote': {
      const ord=parseInt(el.dataset.ordinal);const resolved=el.dataset.resolved==='1';
      if(resolved){api.resolveNote((S.activeSession||S.engagementId),ord,'reopen','operator reopened').then(()=>{loadNotebook();toast('Note reopened')}).catch(e=>toast('Failed: '+e.message));}
      else{const reason=prompt('Reason for resolving:');if(reason)api.resolveNote((S.activeSession||S.engagementId),ord,'resolve',reason).then(()=>{loadNotebook();toast('Note resolved')}).catch(e=>toast('Failed: '+e.message));}
    } break;
    case 'reviewFinding': reviewFinding(el.dataset.id); break;
    case 'deleteFinding': {const id=el.dataset.id;if(confirm('Delete finding '+id+'? This cannot be undone.'))api.deleteFinding((S.activeSession||S.engagementId),id).then(()=>{loadFindings();toast('Finding deleted')}).catch(e=>toast('Failed: '+e.message));} break;
    case 'approveItem': resolveApproval(el.dataset.id,true); break;
    case 'declineItem': resolveApproval(el.dataset.id,false); break;
    case 'consultContinue': resolveConsult(el.dataset.id,'continue'); break;
    case 'consultStop': resolveConsult(el.dataset.id,'stop'); break;
    case 'toggleChain': {const k=el.dataset.key;S.chainOpen[k]=!(S.chainOpen[k]===true);render();} break;
    case 'likeMsg': {const idx=parseInt(el.dataset.idx);S.liked[idx]=!S.liked[idx];render();} break;
    case 'regenMsg': toast('Regeneration not available in dev server'); break;
  }
});

document.getElementById('app').addEventListener('input',function(e){
  if(e.target.id==='homeInput'||e.target.id==='chatInput'){
    S.input=e.target.value;
    const b=document.getElementById('sendBtn');if(b)b.style.opacity=S.input.trim()?'1':'.4';
  }
  else if(e.target.id==='sessionSearch'){S.search=e.target.value;render();}
  else if(e.target.id==='steerInput')S.steerText=e.target.value;
  else if(e.target.id==='noteSearchInput'){S.noteSearch=e.target.value;render();}
  else if(e.target.id==='gfSearch'){S.gFilter.q=e.target.value;render();}
  else if(e.target.id==='neId')S.newEng.id=e.target.value;
  else if(e.target.id==='neScope')S.newEng.scope=e.target.value;
  else if(e.target.id==='neDeny')S.newEng.deny=e.target.value;
});

document.getElementById('app').addEventListener('keydown',function(e){
  if(e.target.id==='homeInput'||e.target.id==='chatInput'){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
  if(e.target.id==='steerInput'){if(e.key==='Enter'){e.preventDefault();sendSteer();}}
});

document.getElementById('app').addEventListener('change',function(e){
  if(e.target.id==='gfPhase'){S.gFilter.phase=e.target.value;render();}
  else if(e.target.id==='gfStatus'){S.gFilter.status=e.target.value;render();}
  else if(e.target.id==='gfConf'){S.gFilter.conf=e.target.value;render();}
  else if(e.target.id==='gfActive'){S.gFilter.activeOnly=e.target.checked;render();}
});

document.getElementById('app').addEventListener('scroll',function(e){
  if(e.target.id==='transcript'){const el=e.target;S.atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<48;}
},true);

/* Spotlight effect */
document.getElementById('app').addEventListener('mousemove',function(e){
  const c=e.target.closest('[data-spot-container]');
  if(!c)return;
  const d=c.querySelector('[data-spot]');if(!d)return;
  const r=c.getBoundingClientRect();
  d.style.opacity='1';
  d.style.background='radial-gradient(260px circle at '+(e.clientX-r.left)+'px '+(e.clientY-r.top)+'px, oklch(62% 0.21 25 / .14), transparent 70%)';
});
document.getElementById('app').addEventListener('mouseleave',function(e){
  const c=e.target.closest('[data-spot-container]');
  if(!c)return;
  const d=c.querySelector('[data-spot]');if(d)d.style.opacity='0';
},true);

document.addEventListener('keydown',function(e){
  const typing=/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName);
  if(e.key==='Escape'){
    if(S.modal){S.modal=null;render();}
    else if(S.approvalsOpen){S.approvalsOpen=false;render();}
    else if(S.ctxOpen){S.ctxOpen=false;render();}
    else if(S.menu){S.menu=null;render();}
    else if(S.statsOpen){S.statsOpen=false;render();}
    else if(S.view==='graph'){S.view='chat';S.selectedNode=null;S.nodeDetail=null;render();}
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();S.sidebarOpen=true;render();
    setTimeout(()=>{const i=document.getElementById('sessionSearch');if(i)i.focus();},50);return;
  }
  if(!typing&&e.key==='?'){S.modal='help';render();}
});

document.addEventListener('mousedown',function(e){
  if(S.menu&&!e.target.closest('[data-action="openMenu"]')&&!e.target.closest('[data-action="pickMenu"]')){S.menu=null;render();}
  if(S.ctxOpen&&!e.target.closest('[data-action="toggleCtx"]')&&!e.target.closest('[data-action="stopProp"]')&&!e.target.closest('[data-action="toggleCtxDetail"]')&&!e.target.closest('[data-action="compactCtx"]')){S.ctxOpen=false;render();}
  if(S.statsOpen&&!e.target.closest('[data-action="toggleStats"]')){S.statsOpen=false;render();}
});

window.addEventListener('resize',function(){
  if(window.innerWidth<900&&S.sidebarOpen)S.sidebarOpen=false;render();
});

/* Hypothesis graph: wheel to zoom, drag to pan (the canvas had no zoom/pan handlers). */
window.addEventListener('wheel',function(e){
  const gc=e.target.closest&&e.target.closest('#graphCanvas');
  if(!gc)return;
  e.preventDefault();
  S.graphZoom=Math.max(0.3,Math.min(2.6,S.graphZoom*(e.deltaY<0?1.12:0.89)));
  const inner=gc.firstElementChild;
  if(inner)inner.style.transform='scale('+S.graphZoom+')';
},{passive:false});
let _gpan=null;
document.addEventListener('mousedown',function(e){
  const gc=e.target.closest&&e.target.closest('#graphCanvas');
  if(!gc||(e.target.closest&&e.target.closest('[data-action]')))return;
  _gpan={x:e.clientX,y:e.clientY,sl:gc.scrollLeft,st:gc.scrollTop,el:gc};
  gc.style.cursor='grabbing';e.preventDefault();
});
document.addEventListener('mousemove',function(e){
  if(!_gpan)return;
  _gpan.el.scrollLeft=_gpan.sl-(e.clientX-_gpan.x);
  _gpan.el.scrollTop=_gpan.st-(e.clientY-_gpan.y);
});
document.addEventListener('mouseup',function(){if(_gpan){try{_gpan.el.style.cursor='grab'}catch(_){}_gpan=null;}});

async function saveEngagement(){
  const id=(document.getElementById('neId')?.value||'').trim();
  const scope=(document.getElementById('neScope')?.value||'').trim();
  if(!/^[a-z0-9][a-z0-9-]{1,30}$/.test(id)){S.newEng.error='ID must be 2-31 chars: lowercase letters, digits, hyphens.';render();return;}
  if(!scope){S.newEng.error='Scope is required.';render();return;}
  try{await api.createEngagement({engagement_id:id,description:scope.split('\n')[0],allow_targets:scope.split('\n').map(s=>s.trim()).filter(Boolean),allowed_action_classes:['passive_recon','active_recon','exploitation'],authorized_by:'web-ui'});
  S.engagementId=id;S.modal=null;toast('Engagement created');loadEngagements();render();}catch(e){S.newEng.error='Failed: '+e.message;render();}
}

let _approvalPoll;
function startApprovalPolling(){stopApprovalPolling();_approvalPoll=setInterval(()=>{if(!S.activeSession)return;pollApprovals();pollConsults();},5000);}
function stopApprovalPolling(){if(_approvalPoll){clearInterval(_approvalPoll);_approvalPoll=null;}}

/* INIT */
(async function init(){
  try{S.apiKey=localStorage.getItem('webUiApiKey')||''}catch(e){}
  render();
  await loadSessions();
  await loadEngagements();
  startApprovalPolling();
})();
</script>
</body>
