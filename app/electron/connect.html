<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect — Oxpecker</title>
<!--
  The packaged (.exe) client's connect screen: where the operator points the app at their Oxpecker
  server and enters the API key, in the program, with no config file to edit (the owner's ask).

  This is a thin client. It does not run the agent or hold data; it remembers the server URL and
  key across launches (localStorage on this file:// page, stable every launch) and hands them to
  the server's own web client by navigating to <server>/app/?key=<key> — which adopts the key and
  scrubs it from the address (session.ts). No IPC, no node integration, no secrets written to disk.
-->
<style>
  :root { --bg:#0a0a0a; --panel:#141414; --panel-2:#1c1c1c; --border:#262626; --text:#ededed; --muted:#8a8a8a; --accent:oklch(62% 0.21 25); --link:#8ab4ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,sans-serif; }
  .card { width:26rem; max-width:90vw; padding:28px; }
  h1 { font-size:22px; font-weight:600; margin:0 0 4px; letter-spacing:-0.01em; }
  p.sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:14px 0 4px; }
  input { width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--border);
          border-radius:8px; padding:10px 12px; font:inherit; }
  button { margin-top:20px; width:100%; background:var(--accent); color:#0a0a0a; border:none;
           border-radius:8px; padding:11px; font:600 15px system-ui; cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  .err { color:var(--accent); font-size:13px; margin-top:12px; min-height:1.2em; }
  .hint { color:#5a5a5a; font-size:11px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Oxpecker</h1>
    <p class="sub">Connect to your Oxpecker server.</p>
    <label for="server">Server address</label>
    <input id="server" type="text" placeholder="http://192.168.1.50:7777" autocomplete="off" />
    <label for="key">API key <span class="hint">(from the server's state/web_ui_api_key.txt)</span></label>
    <input id="key" type="password" placeholder="paste the key" autocomplete="off" />
    <button id="go">Connect</button>
    <div class="err" id="err"></div>
  </div>
<script>
  var S = "oxpecker.connect.server", K = "oxpecker.connect.key";
  var serverEl = document.getElementById("server");
  var keyEl = document.getElementById("key");
  var btn = document.getElementById("go");
  var err = document.getElementById("err");

  try {
    serverEl.value = localStorage.getItem(S) || "";
    keyEl.value = localStorage.getItem(K) || "";
  } catch (e) { /* storage blocked — the fields just start empty */ }

  function normalize(u) {
    u = (u || "").trim().replace(/\/+$/, "");
    if (u && !/^https?:\/\//i.test(u)) u = "http://" + u;
    return u;
  }

  async function connect() {
    var server = normalize(serverEl.value);
    var key = keyEl.value.trim();
    err.textContent = "";
    if (!server) { err.textContent = "Enter the server address."; return; }
    btn.disabled = true;
    btn.textContent = "Connecting…";
    try {
      // /health is the unauthenticated probe the server keeps open for exactly this.
      var resp = await fetch(server + "/health", { cache: "no-store" });
      if (!resp.ok) throw new Error("status " + resp.status);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "Connect";
      err.textContent = "Could not reach " + server + ". Is the server running and on the network?";
      return;
    }
    try {
      localStorage.setItem(S, server);
      localStorage.setItem(K, key);
    } catch (e) { /* not fatal — the key still goes through the URL below */ }
    var q = key ? ("?key=" + encodeURIComponent(key)) : "";
    window.location.href = server + "/app/" + q;
  }

  btn.addEventListener("click", connect);
  keyEl.addEventListener("keydown", function (e) { if (e.key === "Enter") connect(); });
</script>
</body>
</html>
