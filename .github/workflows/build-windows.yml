# Builds the Windows desktop client (.exe) with electron-builder. The app is a thin client: the
# produced installer talks to a remote Oxpecker server and lets the operator enter the server
# address and API key in the program (electron/connect.html), so there is nothing to configure in a
# file. This runs on a Windows runner because a Windows NSIS installer is built natively there.
#
# Two ways to run it:
#   * Actions -> build-windows -> Run workflow: builds a downloadable artifact (no Release).
#   * Push a tag like v0.1.6: builds AND publishes the installer + latest.yml to a GitHub Release,
#     which is the feed electron-updater checks — so every already-installed app auto-updates to it
#     (electron/main.js initAutoUpdate downloads it and offers a restart). Bump the version in
#     app/package.json before tagging, and tag the same version.
name: build-windows

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: write   # a tag build publishes the installer to a GitHub Release (the update feed)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The desktop shell's own deps (electron, electron-builder, electron-updater).
      - run: npm ci

      # On a tag, publish to the GitHub Release so installed apps auto-update; on a manual run,
      # build an artifact only. electron-builder reads the github publish target from package.json.
      - name: Build (and publish on a tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            npx electron-builder --win --publish always
          else
            npx electron-builder --win --publish never
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: oxpecker-windows-installer
          path: app/dist/*.exe
          if-no-files-found: error
